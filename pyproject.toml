# Tool settings only. This project is not a package: pytest settings stay in
# pytest.ini, dependencies in the requirements files.

[tool.ruff]
extend-exclude = [".claude", "graphify-out"]

[tool.ruff.lint]
# Syntax errors and pyflakes (unused or undefined names). The rule set is small
# on purpose: it is green today, and CI keeps it green. Add rules one by one.
select = ["E9", "F"]

[tool.coverage.run]
source = ["config", "models", "services", "workers", "run_worker"]

[tool.coverage.report]
# Measured at 91% when this gate was added (395 tests). The floor leaves a
# small margin; raise it when the number rises.
fail_under = 88
