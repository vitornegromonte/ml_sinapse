name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same as the Dockerfile
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-dev.txt

      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-test.txt

      # All tests run: tests/conftest.py stands in for vLLM (CUDA-only, not in
      # requirements-test.txt) because the vLLM tests patch it anyway.
      - name: Run tests
        run: python -m pytest -q -rs
